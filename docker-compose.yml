services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leadme
    ports:
      - "6432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6800:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/leadme
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev-secret-change-in-production
      DEBUG: "true"
      CRYPTO_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app  # Hot reload in dev

  # Next.js web app
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "6300:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:6800/api/v1
    depends_on:
      - backend

  # React Native mobile (Expo dev server)
  # Optional: only needed for mobile development
  # Run with: docker compose up mobile
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    ports:
      - "6081:8081"
      - "6019:19000"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
    depends_on:
      - backend
    profiles:
      - mobile  # only starts with: docker compose --profile mobile up

volumes:
  postgres_data:
